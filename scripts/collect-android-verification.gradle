// Explicit unsigned CI collection only; never invoked by application runtime.
gradle.projectsEvaluated {
    gradle.rootProject.tasks.register("collectVerificationDependencies") {
        doLast {
            def app = gradle.rootProject.project(":app")
            app.configurations.findAll {
                it.canBeResolved && (it.name.endsWith("CompileClasspath") ||
                    it.name.endsWith("RuntimeClasspath"))
            }.sort { it.name }.each { configuration ->
                println("Verifying dependency inputs for " + configuration.name)
                // Resolve published dependencies, not the Android test's own
                // project outputs, which deliberately have many artifact types.
                // Keep strict resolution: a missing remote artifact must fail.
                configuration.incoming.artifactView {
                    componentFilter { identifier ->
                        identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    }
                }.artifacts.artifactFiles.files
            }
        }
    }
}
